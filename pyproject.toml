[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbs"
version = "0.10.0"
description = "SmartBS modular ST engines + equal-weight blend + ONNX/MQL5 raw_ai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Taoshi / SmartBS" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.0",
  "requests>=2.28",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
tradingview = ["tradingview-datafeed>=2.0"]
onnx = ["onnx>=1.14", "onnxruntime>=1.16", "onnxscript>=0.1"]
mt5 = ["MetaTrader5>=5.0"]
dev = ["pytest>=7.0", "onnx>=1.14", "onnxruntime>=1.16", "onnxscript>=0.1"]

[project.scripts]
smartbs-engines-train = "smartbs_engines.train:main"
smartbs-export-onnx = "smartbs_engines.export_onnx:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartbs_engines*"]

[tool.setuptools.package-data]
smartbs_engines = ["VERSION"]
